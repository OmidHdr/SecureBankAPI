name: securebank

services:
  postgres:
    image: postgres:17-alpine
    container_name: securebank-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

#    ports:
#      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${APP_IMAGE_NAME:-securebank-api:local}
    container_name: securebank-api

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      LOGIN_LOCKOUT_MAX_FAILED_ATTEMPTS: ${LOGIN_LOCKOUT_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_DURATION: ${LOGIN_LOCKOUT_DURATION:-15m}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-1h}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:-false}
      RATE_LIMIT_BUCKET_EXPIRATION: ${RATE_LIMIT_BUCKET_EXPIRATION:-10m}
      RATE_LIMIT_MAXIMUM_BUCKETS: ${RATE_LIMIT_MAXIMUM_BUCKETS:-10000}
      RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-10}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-1m}
      RATE_LIMIT_REGISTER_REQUESTS: ${RATE_LIMIT_REGISTER_REQUESTS:-5}
      RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-1m}
      RATE_LIMIT_REFRESH_REQUESTS: ${RATE_LIMIT_REFRESH_REQUESTS:-20}
      RATE_LIMIT_REFRESH_WINDOW: ${RATE_LIMIT_REFRESH_WINDOW:-1m}
      RATE_LIMIT_LOGOUT_REQUESTS: ${RATE_LIMIT_LOGOUT_REQUESTS:-20}
      RATE_LIMIT_LOGOUT_WINDOW: ${RATE_LIMIT_LOGOUT_WINDOW:-1m}

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped

volumes:
  postgres_data:
