spring:
  application:
    name: SecureBankAPI
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_bank_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

auth:
  login-lockout:
    max-failed-attempts: ${LOGIN_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
    duration: ${LOGIN_LOCKOUT_DURATION:15m}

rate-limit:
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  bucket-expiration: ${RATE_LIMIT_BUCKET_EXPIRATION:10m}
  maximum-buckets: ${RATE_LIMIT_MAXIMUM_BUCKETS:10000}
  login:
    requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
    window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
  register:
    requests: ${RATE_LIMIT_REGISTER_REQUESTS:5}
    window: ${RATE_LIMIT_REGISTER_WINDOW:1m}
  refresh:
    requests: ${RATE_LIMIT_REFRESH_REQUESTS:20}
    window: ${RATE_LIMIT_REFRESH_WINDOW:1m}
  logout:
    requests: ${RATE_LIMIT_LOGOUT_REQUESTS:20}
    window: ${RATE_LIMIT_LOGOUT_WINDOW:1m}

app:
  cors:
    production: false
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

logging:
  level:
    root: INFO
    ir.h0p3.securebankapi: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: logs/secure-bank-api.log
